pad_spacing_1oz_mm = { value = 0.10, page = "main", quote = "1oz: Min. pad spacing: 0.10 mm (green, red, yellow, blue, purple)", measurand = "pad_gap" }
pad_spacing_1oz_dark_mm = { value = 0.13, page = "main", quote = "Min. pad spacing: 0.13 mm (black, white)", measurand = "pad_gap" }
pad_spacing_2oz_mm = { value = 0.20, page = "main", quote = "2oz: Min. pad spacing: 0.20 mm (any color)", measurand = "pad_gap" }
