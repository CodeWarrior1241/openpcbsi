[published.board]
thickness_min_mm = { value = 0.4, page = "main", quote = "Thickness: 0.4 – 4.5 mm", measurand = "board_thickness" }
thickness_max_mm = { value = 4.5, page = "main", quote = "Thickness: 0.4 – 4.5 mm", measurand = "board_thickness", conflict = "the same page's FAQ says \"standard thicknesses from 0.4 mm to 3.2 mm\"" }

# ---- via covering ----------------------------------------------------------------------------------
[published.via_cover]
filled_default_from_layers = { value = 6, page = "main", quote = "② This process is the default for 6-layer and above multilayer boards.", measurand = "layer_count", use = "order" }
filled_order_note = { value = "say which vias to fill", page = "via_covering", quote = "For epoxy-filled vias, please leave a note or upload an image along with your design files to explain which vias should be filled.", measurand = "order_option", use = "order" }
filled_via_min_mm = { value = 0.15, page = "main", quote = "Compatible with via diameters from 0.15 to 0.55 mm.", measurand = "drill", note = "the lower bound is the smallest mechanical drill; the range is read as drill sizes, as the via-covering article states for its upper bound" }
filled_via_max_mm = { value = 0.50, page = "via_covering", quote = "Plugged and epoxy-filled vias holes should not be larger than 0.5 mm as larger holes may be incompletely filled.", measurand = "drill", conflict = "the capability page says \"Compatible with via diameters from 0.15 to 0.55 mm\" (main page); the stricter, explicitly hole-size figure is used" }
plugged_via_max_mm = { value = 0.50, page = "main", quote = "③ Filled vias must be no wider than 0.5 mm diameter", measurand = "drill" }
plugged_to_opening_mm = { value = 0.35, page = "main", quote = "② Filled vias should have ≥ 0.35 mm clearance from other soldermask openings (e.g. pads)", measurand = "via_to_mask_opening" }

[published.mask]
