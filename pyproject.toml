[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openpcbsi"
version = "0.2.0"
description = "Signal- and power-integrity evaluation of KiCad 10 boards"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"          # tomllib; kicad-monkey needs 3.11 to 3.14
# the board is read by openpcbsi.parse on the pinned parsers in deps/ (deps/setup_parsers.sh); KiCad's pcbnew is optional
dependencies = ["numpy", "scipy", "matplotlib"]

[project.scripts]
openpcbsi = "openpcbsi.__main__:main"

[tool.setuptools]
packages = ["openpcbsi", "openpcbsi.parse"]

[tool.setuptools.package-data]
openpcbsi = ["fabs/*.toml"]
