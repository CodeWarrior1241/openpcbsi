via_hole_min_mm = { value = 0.15, page = "main", quote = "Min. Via hole size/diameter: 0.15/0.25mm", measurand = "drill", note = "the same page prefers 0.2 mm (\"Preferred Min. Via hole size: 0.2mm\")" }
via_diameter_min_mm = { value = 0.25, page = "main", quote = "2-layer: 0.15mm hole size / 0.25mm via diameter", measurand = "via_pad_diameter" }
via_diameter_over_hole_mm = { value = 0.10, page = "main", quote = "Via diameter should be 0.1mm(0.15mm preferred) larger than Via hole size.", measurand = "via_pad_minus_drill" }
npth_min_mm = { value = 0.50, page = "main", quote = "Min. Non-plated holes: 0.50mm", measurand = "drill" }
drill_max_mm = { value = 6.3, page = "main", quote = "Drill Diameter: Multilayer: 0.15 – 6.3 mm", measurand = "drill" }
via_hole_spacing_mm = { value = 0.20, page = "main", quote = "Via Hole-to-Hole Spacing: 0.2mm", measurand = "hole_centre_to_centre", certainty = "chosen", note = "no JLCPCB page says whether hole-to-hole spacing is measured wall to wall or centre to centre; the board owner chose centre to centre (the lenient reading: a pair that passes it but not wall to wall is noted)" }
pad_hole_spacing_mm = { value = 0.45, page = "main", quote = "Pad Hole-to-Hole Spacing: 0.45mm", measurand = "hole_centre_to_centre", certainty = "chosen", note = "as via_hole_spacing_mm" }
plated_slot_min_2l_mm = { value = 0.50, page = "main", quote = "Min. Plated Slots Width: 2-layer: 0.5mm", measurand = "slot_width" }
plated_slot_min_ml_mm = { value = 0.35, page = "main", quote = "Min. Plated Slots Width: Multi-layer: 0.35mm", measurand = "slot_width" }
castellated_hole_min_mm = { value = 0.50, page = "main", quote = "Min. Castellated Holes: 0.5mm; ① Hole diameter (Φ): ≥ 0.5 mm", measurand = "drill", conflict = "the castellated-PCB guide gives 0.6 mm minimum, 0.8 mm recommended (castellated page)" }
castellated_spacing_mm = { value = 0.50, page = "main", quote = "③ Hole to hole (D): ≥ 0.5 mm", measurand = "hole_wall_to_wall", note = "the castellated-PCB guide measures it \"Castellated hole edge to hole edge\"", conflict = "the castellated-PCB guide gives 0.6 mm (castellated page)" }

# "PTH annular ring" by layer count and copper weight: absolute minimum and recommended
[[published.pth_ring]]
layers = [1, 2]
oz = 1.0
min_mm = 0.18
recommended_mm = 0.25
page = "main"
quote = "PTH annular ring, 2-layer: 1 oz: Recommended 0.25 mm or above; absolute minimum 0.18 mm"

[[published.pth_ring]]
layers = [3, 32]
oz = 1.0
min_mm = 0.15
recommended_mm = 0.20
page = "main"
quote = "Multilayer: 1 oz: Recommended 0.20 mm or above; absolute minimum 0.15 mm"

[[published.pth_ring]]
layers = [1, 32]
oz = 2.0
min_mm = 0.254
recommended_mm = 0.254
page = "main"
quote = "2 oz: 0.254 mm or above"

