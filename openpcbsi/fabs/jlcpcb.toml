# Fabricator profile: JLCPCB (exemplar for `openpcbsi dfm`).
#
# Every value under [published] is from JLCPCB's own pages, as read on the date below, and carries:
#   page        a key of [fab.pages]
#   quote       the page's own words for the value (row label and cell, or the sentence)
#   measurand   what is measured (see docs/dfm.md, "What a limit measures")
#   certainty   stated (the page says what it measures; the default), interpreted (the profile had to
#               choose; a rule judging with it can warn but not fail), chosen (the board owner's
#               choice, named in `note`), confirmed (the fabricator answered; `note` says who and when)
#   use         limit (judged by a rule; the default), order (an order option: the order checklist),
#               input (an input to a model or a choice), record (recorded, not judged)
#   conflict    another page of the same fabricator that gives a different figure
# Values under [standard] come from a published industry standard; [guidance] from the fabricator's
# design articles (not its capability pages); [assumed] are on neither and are used only by rankings.
# Copy this file to describe another fabricator; `dfm --fab FILE` reads it.

[fab]
name = "JLCPCB"
retrieved = "2026-11-16"

[fab.pages]
main = "https://jlcpcb.com/capabilities/pcb-capabilities"
assembly = "https://jlcpcb.com/capabilities/pcb-assembly-capabilities"
stencil = "https://jlcpcb.com/capabilities/pcb-stencil-manufacturing"
stencil_order = "https://jlcpcb.com/help/article/instructions-for-stencil-order"
stencil_guide = "https://jlcpcb.com/blog/how-to-choose-a-solder-paste-stencil"
stencil_design = "https://jlcpcb.com/blog/design-guidelines-for-industry-standard-stencils"
via_covering = "https://jlcpcb.com/help/article/pcb-via-covering"
via_finishes = "https://jlcpcb.com/blog/five-via-finishes"
part_spacing = "https://jlcpcb.com/help/article/minimum-spacing-for-smd-components"
castellated = "https://jlcpcb.com/blog/142-castellated-pcbs-introduction-and-design-requirements"

# ---- track width / spacing by layer count and finished copper weight ----------------------------
# `layers` is [min, max] copper layers; `oz` the finished copper weight of the layer the row applies
# to. JLCPCB gives no separate row for inner layers; their default copper is 0.5 oz ("Finished copper
# weight of inner layer is 0.5oz by default"), for which no row exists: the 1 oz row is used (heavier
# copper needs the wider figure, so this is the strict side) and the finding says so.
[[published.track]]
layers = [1, 2]
oz = 1.0
width_mm = 0.10
space_mm = 0.10
page = "main"
quote = "Min. track width and spacing (1 oz): 1- and 2-layer: 0.10 / 0.10 mm (4 / 4 mil)"

[[published.track]]
layers = [3, 32]
oz = 1.0
width_mm = 0.09
space_mm = 0.09
bga_mm = 0.0762
page = "main"
quote = "Multilayer: 0.09 / 0.09 mm (3.5 / 3.5 mil). 3 mil is acceptable in BGA fan-outs."

[[published.track]]
layers = [1, 2]
oz = 2.0
width_mm = 0.16
space_mm = 0.16
page = "main"
quote = "Min. track width and spacing (2 oz): 2-layer: 0.16 / 0.16 mm (6.5 / 6.5 mil)"

[[published.track]]
layers = [3, 32]
oz = 2.0
width_mm = 0.15
space_mm = 0.15
page = "main"
quote = "Multilayer: 0.15 / 0.15 mm (6 / 6 mil)"

[[published.track]]
layers = [1, 2]
oz = 2.5
width_mm = 0.20
space_mm = 0.20
page = "main"
quote = "Min. track width and spacing (2.5 oz): 2 layer: 0.2/0.2mm(8mil/8mil)"

[[published.track]]
layers = [1, 2]
oz = 3.5
width_mm = 0.25
space_mm = 0.25
page = "main"
quote = "Min. track width and spacing (3.5 oz): 2 layer: 0.25/0.25mm(10mil/10mil)"

[[published.track]]
layers = [1, 2]
oz = 4.5
width_mm = 0.30
space_mm = 0.30
page = "main"
quote = "Min. track width and spacing (4.5 oz): 2 layer: 0.3/0.3mm(12mil/12mil)"

[published.etch]
same_net_spacing_mm = { value = 0.25, page = "main", quote = "Same-net track spacing: 0.25mm", measurand = "copper_gap" }
track_tolerance_pct = { value = 20.0, page = "main", quote = "Track width tolerance: ±20%", measurand = "finished_track_width", use = "record" }

# ---- holes ------------------------------------------------------------------------------------------
