pth_hole_to_copper_mm = { value = 0.28, page = "main", quote = "PTH to Track: 0.28mm (0.35mm is recommended, minimum 0.28mm)", measurand = "hole_wall_to_copper" }
npth_hole_to_copper_mm = { value = 0.20, page = "main", quote = "NPTH to Track: 0.2mm", measurand = "hole_wall_to_copper" }
inner_via_hole_to_copper_mm = { value = 0.20, page = "main", quote = "Inner layer via hole to copper clearance: 0.2mm", measurand = "hole_wall_to_copper" }
inner_pth_hole_to_copper_mm = { value = 0.30, page = "main", quote = "Inner layer PTH pad hole to copper clearance: 0.3mm", measurand = "hole_wall_to_copper" }
pad_to_track_mm = { value = 0.10, page = "main", quote = "Pad to track clearance (1oz): 0.1mm", measurand = "copper_gap" }
bga_pad_to_track_mm = { value = 0.09, page = "main", quote = "BGA pad to trace clearance ≥ 0.1 mm (min. 0.09 mm for multilayer boards)", measurand = "copper_gap", note = "0.09 mm on multilayer boards; 0.1 mm otherwise" }
copper_to_edge_mm = { value = 0.20, page = "main", quote = "Copper clearance from routed board edges: ≧0.2 mm", measurand = "copper_to_board_edge" }
